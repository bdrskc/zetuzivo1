<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <meta name="description" content="ZET uživo — neslužbena karta položaja ZET tramvaja i autobusa." />
    <title>ZET uživo — položaji tramvaja i autobusa (neslužbeno)</title>
    <script>
      try {
        var t = localStorage.getItem("vozlinija-theme");
        if (t !== "dark" && t !== "light") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        var l = localStorage.getItem("vozlinija-lang");
        if (l === "en") {
          document.documentElement.lang = "en";
          document.title = "ZET uživo — live tram and bus positions (unofficial)";
        }
      } catch (e) {}
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #root {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
